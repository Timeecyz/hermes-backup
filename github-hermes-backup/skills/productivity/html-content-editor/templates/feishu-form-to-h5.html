<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研学营参加人员信息收集表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; }
    .form-card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .form-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #1a1a1a; }
    .form-desc { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; line-height: 1.5; }
    .field-group { margin-bottom: 20px; }
    .field-label { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .field-label .req { color: #e53935; }
    .field-number { display: inline-block; width: 20px; height: 20px; background: #0050c8; color: #fff; border-radius: 50%; font-size: 11px; text-align: center; line-height: 20px; margin-right: 6px; }
    .field-hint { font-size: 12px; color: #999; margin-bottom: 6px; padding-left: 26px; }
    input[type="text"], input[type="tel"], input[type="number"], input[type="date"], textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #fff;
    }
    input:focus, textarea:focus { border-color: #0050c8; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 26px; }
    .radio-option { padding: 6px 14px; border: 1.5px solid #e0e0e0; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; user-select: none; }
    .radio-option.selected { background: #0050c8; color: #fff; border-color: #0050c8; }
    .radio-option input { display: none; }
    .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-left: 26px; }
    .size-option { padding: 8px 4px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 12px; text-align: center; cursor: pointer; transition: all 0.2s; user-select: none; }
    .size-option.selected { background: #0050c8; color: #fff; border-color: #0050c8; }
    .size-option input { display: none; }
    textarea { resize: vertical; min-height: 80px; }
    .submit-btn { width: 100%; padding: 14px; background: #0050c8; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .submit-btn:active { background: #003c9e; }
    .copy-note { font-size: 12px; color: #999; text-align: center; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="form-card">
  <div class="form-title">研学营参加人员信息收集表</div>
  <div class="form-desc">请您填写研学营参加人员的基本信息，<br>方便我们后续安排，谢谢您的配合。</div>

  <!-- 1. 孩子姓名 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">1</span>孩子姓名</label>
    <input type="text" id="child_name" placeholder="请输入孩子姓名">
  </div>

  <!-- 2. 国籍 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">2</span>国籍</label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="child_nationality" value="中国大陆">中国大陆</label>
      <label class="radio-option"><input type="radio" name="child_nationality" value="中国香港">中国香港</label>
      <label class="radio-option"><input type="radio" name="child_nationality" value="中国澳门">中国澳门</label>
      <label class="radio-option"><input type="radio" name="child_nationality" value="其他国家/地区">其他国家/地区</label>
    </div>
  </div>

  <!-- 3. 证件号码 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">3</span>证件号码</label>
    <div class="field-hint">大陆居民填写居民身份证，港澳居民填写回乡证，外籍人士填写护照号</div>
    <input type="text" id="child_id" placeholder="请输入证件号码">
  </div>

  <!-- 4. 出生日期 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">4</span>出生日期</label>
    <div class="field-hint">除大陆居民外，港澳居民、外籍人士须填写出生年月</div>
    <input type="date" id="child_dob">
  </div>

  <!-- 5. 是否已办理港澳通行证 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">5</span>是否已办理港澳通行证</label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="child_permit" value="是">是</label>
      <label class="radio-option"><input type="radio" name="child_permit" value="否">否</label>
    </div>
  </div>

  <!-- 6. 性别 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">6</span>性别</label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="child_gender" value="男">男</label>
      <label class="radio-option"><input type="radio" name="child_gender" value="女">女</label>
    </div>
  </div>

  <!-- 7. 年龄 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">7</span>年龄</label>
    <input type="number" id="child_age" placeholder="请输入年龄" min="1" max="100">
  </div>

  <!-- 8. 营服尺码 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">8</span>营服尺码 <span class="req">*</span></label>
    <div class="size-grid">
      <label class="size-option"><input type="radio" name="size" value="XS">XS<br><small>120以下</small></label>
      <label class="size-option"><input type="radio" name="size" value="S">S<br><small>120-140</small></label>
      <label class="size-option"><input type="radio" name="size" value="M">M<br><small>140-155</small></label>
      <label class="size-option"><input type="radio" name="size" value="L">L<br><small>155-170</small></label>
      <label class="size-option"><input type="radio" name="size" value="XL">XL<br><small>170-180</small></label>
      <label class="size-option"><input type="radio" name="size" value="XXL">XXL<br><small>180以上</small></label>
    </div>
  </div>

  <!-- 9. 家长姓名 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">9</span>家长姓名 <span class="req">*</span></label>
    <input type="text" id="parent_name" placeholder="请输入家长姓名" required>
  </div>

  <!-- 10. 家长性别 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">10</span>家长性别 <span class="req">*</span></label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="parent_gender" value="男">男</label>
      <label class="radio-option"><input type="radio" name="parent_gender" value="女">女</label>
    </div>
  </div>

  <!-- 11. 家长国籍 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">11</span>家长国籍 <span class="req">*</span></label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="parent_nationality" value="中国大陆">中国大陆</label>
      <label class="radio-option"><input type="radio" name="parent_nationality" value="中国香港">中国香港</label>
      <label class="radio-option"><input type="radio" name="parent_nationality" value="中国澳门">中国澳门</label>
      <label class="radio-option"><input type="radio" name="parent_nationality" value="其他国家/地区">其他国家/地区</label>
    </div>
  </div>

  <!-- 12. 家长是否已办理港澳通行证 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">12</span>家长是否已办理港澳通行证 <span class="req">*</span></label>
    <div class="radio-group">
      <label class="radio-option"><input type="radio" name="parent_permit" value="是">是</label>
      <label class="radio-option"><input type="radio" name="parent_permit" value="否">否</label>
    </div>
  </div>

  <!-- 13. 家长证件号码 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">13</span>家长证件号码 <span class="req">*</span></label>
    <div class="field-hint">大陆居民填写居民身份证，港澳居民填写回乡证，外籍人士填写护照号</div>
    <input type="text" id="parent_id" placeholder="请输入家长证件号码">
  </div>

  <!-- 14. 家长联系方式 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">14</span>家长联系方式 <span class="req">*</span></label>
    <input type="tel" id="parent_phone" placeholder="请输入手机号" required>
  </div>

  <!-- 15. 备注 -->
  <div class="field-group">
    <label class="field-label"><span class="field-number">15</span>备注</label>
    <div class="field-hint">请填写学生及家长饮食禁忌、过敏源等信息</div>
    <textarea id="notes" placeholder="如有饮食禁忌、过敏源等，请在此说明"></textarea>
  </div>

  <button class="submit-btn" onclick="submitForm()">提交信息</button>
  <div class="copy-note">⚠️ 本页面为信息记录表单，无法直接提交至飞书。<br>提交后请复制填写内容，发送至活动组织方。</div>
</div>

<script>
  // Radio button visual selection
  document.querySelectorAll('.radio-option input, .size-option input').forEach(input => {
    input.addEventListener('change', () => {
      const name = input.name;
      document.querySelectorAll(`input[name="${name}"]`).forEach(el => {
        el.closest('.radio-option, .size-option').classList.toggle('selected', el.checked);
      });
    });
  });

  function submitForm() {
    const required = { 9: '家长姓名', 14: '家长联系方式' };
    let missing = [];
    for (const [num, label] of Object.entries(required)) {
      const field = num === '9' ? document.getElementById('parent_name') : document.getElementById('parent_phone');
      if (!field.value.trim()) missing.push(`${num}. ${label}`);
    }
    if (missing.length) {
      alert('请填写必填项：' + missing.join('、'));
      return;
    }

    const data = {
      '1.孩子姓名': document.getElementById('child_name').value,
      '2.国籍': document.querySelector('input[name="child_nationality"]:checked')?.value || '',
      '3.证件号码': document.getElementById('child_id').value,
      '4.出生日期': document.getElementById('child_dob').value,
      '5.是否已办理港澳通行证': document.querySelector('input[name="child_permit"]:checked')?.value || '',
      '6.性别': document.querySelector('input[name="child_gender"]:checked')?.value || '',
      '7.年龄': document.getElementById('child_age').value,
      '8.营服尺码': document.querySelector('input[name="size"]:checked')?.value || '',
      '9.家长姓名': document.getElementById('parent_name').value,
      '10.家长性别': document.querySelector('input[name="parent_gender"]:checked')?.value || '',
      '11.家长国籍': document.querySelector('input[name="parent_nationality"]:checked')?.value || '',
      '12.家长是否已办理港澳通行证': document.querySelector('input[name="parent_permit"]:checked')?.value || '',
      '13.家长证件号码': document.getElementById('parent_id').value,
      '14.家长联系方式': document.getElementById('parent_phone').value,
      '15.备注': document.getElementById('notes').value,
    };

    const text = Object.entries(data).map(([k, v]) => `${k}：${v}`).join('\n');
    const encoded = encodeURIComponent(text);
    const subject = encodeURIComponent('研学营参加人员信息收集表');
    window.location.href = `mailto:?subject=${subject}&body=${encoded}`;
  }
</script>
</body>
</html>
